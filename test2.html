<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直近の行動 - MCP Event App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: #2a2a3e;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #3a3a4e;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb, #f5576c);
            background-size: 300% 100%;
            animation: gradient 3s ease infinite;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0f0f0;
        }
        .header-icon {
            font-size: 28px;
            margin-right: 12px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        .header-title {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #9d84ff, #ff84c1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .event-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .event-item {
            background: linear-gradient(135deg, #3a3a4e 0%, #2a2a3e 100%);
            border-radius: 12px;
            padding: 16px;
            border: 2px solid transparent;
            background-clip: padding-box;
            transition: all 0.3s ease;
            position: relative;
        }
        .event-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 12px;
            padding: 2px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .event-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
        .event-item:hover::before {
            opacity: 1;
        }
        .event-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 8px;
            color: #9d84ff;
            display: flex;
            align-items: center;
        }
        .event-title::before {
            content: '📌';
            margin-right: 8px;
        }
        .event-time {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .event-time-icon {
            margin-right: 8px;
            font-size: 16px;
            filter: hue-rotate(200deg);
        }
        .event-location {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }
        .event-location-icon {
            margin-right: 8px;
            font-size: 16px;
            filter: hue-rotate(50deg);
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .empty-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #667eea;
        }
        .empty-description {
            font-size: 15px;
            color: #888;
        }
        .loading {
            text-align: center;
            padding: 30px;
            color: #667eea;
        }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <span class="header-icon">📅</span>
                <h1 class="header-title">直近の行動</h1>
            </div>
            <div id="events-container">
                <div class="loading">
                    <span class="spinner"></span>
                    読み込み中...
                </div>
            </div>
        </div>
    </div>

    <script>
        // MCP Appsからデータを受け取って表示する関数
        function renderEvents(events) {
            const container = document.getElementById('events-container');
            
            if (!events || events.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <div class="empty-title">直近の行動はありません</div>
                        <div class="empty-description">新しい予定を追加してください</div>
                    </div>
                `;
                return;
            }
            
            const eventListHTML = events.map(event => `
                <div class="event-item">
                    <div class="event-title">${escapeHtml(event.subject || '（件名なし）')}</div>
                    <div class="event-time">
                        <span class="event-time-icon">🕐</span>
                        ${escapeHtml(event.startDateTime || '')}
                    </div>
                    ${event.location ? `
                        <div class="event-location">
                            <span class="event-location-icon">📍</span>
                            ${escapeHtml(event.location)}
                        </div>
                    ` : ''}
                </div>
            `).join('');
            
            container.innerHTML = `<div class="event-list">${eventListHTML}</div>`;
        }
        
        // HTMLエスケープ関数
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // グローバル関数として公開
        window.renderEvents = renderEvents;
        
        // デバッグ用：デモデータで表示をテスト
        if (window.location.search.includes('demo=true')) {
            setTimeout(() => {
                renderEvents([
                    {
                        subject: 'デモ予定',
                        startDateTime: '2026/05/27 17:00',
                        location: '会議室A'
                    }
                ]);
            }, 1000);
        }
    </script>
</body>
</html>
